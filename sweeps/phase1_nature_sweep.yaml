# Phase 1 · Step 1 — PPO hyperparameter sweep on the Nature-CNN baseline.
# Map is selected via MK_STATE=MarioCircuit2_M (set in the launcher, not here).
entity: tannermcleod21-duke-university   # EDIT if your W&B entity differs
project: mariokart-rl                    # keep sweep runs alongside normal runs
program: src/train.py            # informational; the command block below is authoritative
method: bayes
metric:
  name: avg_return
  goal: maximize

early_terminate:
  type: hyperband
  eta: 3
  min_iter: 1000000

parameters:
  learning-rate:
    distribution: log_uniform_values
    min: 0.00001                 # 1e-5
    max: 0.0005                  # 5e-4
  clip-coef:
    values: [0.1, 0.2, 0.3]
  ent-coef-start:
    values: [0.01, 0.03, 0.05]
  rollout-steps:
    values: [1024, 2048, 4096]

command:
  - ${env}
  - python
  - -m
  - src.train
  - --agent
  - ppo_nature
  - --total-timesteps
  - "6000000"
  - --num-envs
  - "8"                          # match the 8 CPUs allocated per job; fixed for all of Phase 1
  - --checkpoint-freq
  - "100000000"                  # update % checkpoint_freq never hits -> no mid-run eval/video
  - ${args}                      # sweep fills: --learning-rate=... --clip-coef=... etc.
